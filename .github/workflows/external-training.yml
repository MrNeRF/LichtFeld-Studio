name: External training contracts
on:
  push:
    paths:
      - 'src/python/**'
      - 'src/core/scene.cpp'
      - 'src/core/include/core/scene.hpp'
      - 'src/training/trainer.cpp'
      - 'src/visualizer/**'
      - 'tests/external_training/**'
      - '.github/workflows/external-training.yml'
  pull_request:
    paths:
      - 'src/python/**'
      - 'src/core/scene.cpp'
      - 'src/core/include/core/scene.hpp'
      - 'src/training/trainer.cpp'
      - 'src/visualizer/**'
      - 'tests/external_training/**'
      - '.github/workflows/external-training.yml'
permissions:
  contents: read
jobs:
  contracts:
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      NVIDIA_VISIBLE_DEVICES: void
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests/external_training -p "test_*.py"
