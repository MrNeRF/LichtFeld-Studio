name: diag-unc-rename
on:
  push:
    branches: [ diag/unc-rename ]
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MrNeRF/LichtFeld-Studio
          ref: master
          path: lfs
          sparse-checkout: src/core/include
      - name: Provision a network share for path tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' | Format-List LongPathsEnabled, NtfsDisable8dot3NameCreation
          $local = Join-Path $env:RUNNER_TEMP 'lfs-unc-share'
          New-Item -ItemType Directory -Force -Path $local | Out-Null
          Start-Service LanmanServer
          New-SmbShare -Name 'lfs-unc-tests' -Path $local -FullAccess "$env:USERDOMAIN\$env:USERNAME" | Out-Null
          "PROBE_UNC=\\localhost\lfs-unc-tests" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and run the rename probe
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++latest /EHsc /utf-8 /permissive- /O2 /MD /Ilfs\src\core\include sweep.cpp /Fe:sweep.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++latest /EHsc /utf-8 /permissive- /O2 /MD /Ilfs\src\core\include probe2.cpp /Fe:probe2.exe
          if errorlevel 1 exit /b 1
          echo == length sweep, fresh session
          set PROBE_ROOT=%PROBE_UNC%
          sweep.exe
          echo == probe 2 without FileRenameInfoEx
          set PROBE_ROOT=%PROBE_UNC%\release
          set PROBE_NOPOSIX=1
          probe2.exe
          echo == probe 2 verbatim
          set PROBE_NOPOSIX=
          set PROBE_ROOT=%PROBE_UNC%\debug
          probe2.exe
          echo == length sweep after FileRenameInfoEx
          set PROBE_ROOT=%PROBE_UNC%\later
          sweep.exe
      - name: Client and server SMB settings
        shell: pwsh
        run: |
          Get-SmbClientConfiguration | Format-List *
          Get-SmbServerConfiguration | Format-List EnableLeasing, EnableOplocks, EnableStrictNameChecking, EncryptData
