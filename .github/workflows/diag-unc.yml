name: diag-unc-rename
on:
  push:
    branches: [ diag/unc-rename ]
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MrNeRF/LichtFeld-Studio
          ref: master
          path: lfs
          sparse-checkout: src/core/include
      - name: Provision a network share for path tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $local = Join-Path $env:RUNNER_TEMP 'lfs-unc-share'
          New-Item -ItemType Directory -Force -Path $local | Out-Null
          Start-Service LanmanServer
          New-SmbShare -Name 'lfs-unc-tests' -Path $local -FullAccess "$env:USERDOMAIN\$env:USERNAME" | Out-Null
          "PROBE_UNC=\\localhost\lfs-unc-tests" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PROBE_LOCAL=$local" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and run the rename probe
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++latest /EHsc /utf-8 /permissive- /O2 /MD /Ilfs\src\core\include probe.cpp /Fe:probe.exe
          if errorlevel 1 exit /b 1
          set PROBE_ROOT=%PROBE_UNC%\release
          probe.exe
          set PROBE_ROOT=%PROBE_LOCAL%\local
          probe.exe
          cl /nologo /std:c++latest /EHsc /utf-8 /permissive- /Od /MDd /Ilfs\src\core\include probe.cpp /Fe:probe_debug.exe
          set PROBE_ROOT=%PROBE_UNC%\debug
          probe_debug.exe
          cl /Bv 2>&1 | findstr /i "version"
