name: Property Contracts

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  property-contracts:
    if: github.repository == 'MrNeRF/LichtFeld-Studio' || github.event.pull_request.base.repo.full_name == 'MrNeRF/LichtFeld-Studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CUDA_VISIBLE_DEVICES: ''
      PYTHONUTF8: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install lightweight test dependencies
        run: python -m pip install 'pytest>=7.0'

      - name: Check shipped Python default declarations
        run: python tools/check_property_contracts.py --source-only

      - name: Test property checker and compatibility rules
        run: python -m pytest tests/python/test_check_property_contracts.py tests/python/test_plugin_validator.py -q
