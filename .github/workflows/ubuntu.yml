name: Ubuntu CUDA Build

on:
  push:
    branches: [ dev, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ dev, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  hip-native-changes:
    name: Check native HIP paths
    if: github.repository == 'MrNeRF/LichtFeld-Studio' || github.event.pull_request.base.repo.full_name == 'MrNeRF/LichtFeld-Studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - name: Checkout source and comparison history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check paths without installing the SDK
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tools/hip_native_ci_filter.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT"

  hip-native-compile:
    name: HIP native compile (CPU runner)
    needs: hip-native-changes
    if: needs.hip-native-changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      HIP_VISIBLE_DEVICES: '-1'
      ROCR_VISIBLE_DEVICES: '-1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python and SDK download cache
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cmake/hip-native/ci-requirements.txt

      - name: Install native build tools
        run: |
          python -m pip install --index-url https://pypi.org/simple 'cmake==4.4.0'
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build curl unzip

      - name: Install pinned ROCm development SDK
        run: python -m pip install -r cmake/hip-native/ci-requirements.txt

      - name: Install pinned Slang source-generation compiler
        run: |
          curl --fail --location --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.5/slang-2026.5-linux-x86_64.zip \
            -o "$RUNNER_TEMP/hip-slang.zip"
          printf '%s  %s\n' 11d3327ced3f18aacd94e062acb23848e5aca4c52f80306133ecf09f4a49a75659266475a19fc5efb81b90889d6c82d18d53367338e714f5c66accbe089f9498 "$RUNNER_TEMP/hip-slang.zip" | sha512sum --check -
          mkdir -p "$RUNNER_TEMP/hip-slang"
          unzip -q "$RUNNER_TEMP/hip-slang.zip" -d "$RUNNER_TEMP/hip-slang"
          chmod +x "$RUNNER_TEMP/hip-slang/bin/slangc"
          echo "$RUNNER_TEMP/hip-slang/bin" >> "$GITHUB_PATH"

      - name: Compile native HIP module for all declared targets
        run: |
          sdk_root="$(rocm-sdk path --root)"
          cmake -S cmake/hip-native -B "$RUNNER_TEMP/hip-native-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLFS_HIP_ROOT="$sdk_root" \
            -DLFS_HIP_PORTABLE=ON \
            -DLFS_HIP_OFFLOAD_COMPRESSION=ON \
            -DLFS_HIP_NATIVE_GPU_TESTS=OFF \
            -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build "$RUNNER_TEMP/hip-native-build" --parallel 2

      - name: Check configuration and module ABI without a GPU
        run: |
          ctest --test-dir "$RUNNER_TEMP/hip-native-build" \
            --output-on-failure --no-tests=error -L cpu

      - name: Compile SDK-free host loader and check native exports
        run: |
          cmake -S cmake/hip-host -B "$RUNNER_TEMP/hip-host-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLFS_HIP_HOST_TEST_MODULE="$RUNNER_TEMP/hip-native-build/runtime/liblfs_hip_runtime.so"
          cmake --build "$RUNNER_TEMP/hip-host-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/hip-host-build" \
            --output-on-failure --no-tests=error -L cpu

  build-ubuntu:
    needs: hip-native-changes
    if: github.repository == 'MrNeRF/LichtFeld-Studio' || github.event.pull_request.base.repo.full_name == 'MrNeRF/LichtFeld-Studio'
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.8.0-devel-ubuntu24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      CC: gcc-14
      CXX: g++-14
      VCPKG_BUILD_TYPE: release
      VCPKG_FORCE_SYSTEM_BINARIES: 1
      CMAKE_MAKE_PROGRAM: /usr/bin/ninja
      CUDA_PATH: /usr/local/cuda

    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install uv
        if: matrix.build_type == 'Release'
        uses: astral-sh/setup-uv@v5

      - name: Free disk space
        run: |
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          # Host paths (may not exist in container)
          rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/lib/android /opt/az
          # CUDA extras - samples, docs, tools we don't need
          rm -rf /usr/local/cuda/nsight* /usr/local/cuda/compute-sanitizer
          rm -rf /usr/local/cuda/extras /usr/local/cuda/tools
          rm -rf /usr/local/cuda/doc
          # Remove large static libs but keep ones needed for build
          find /usr/local/cuda/targets/x86_64-linux/lib -name '*.a' \
            ! -name 'libcudart_static.a' \
            ! -name 'libcudadevrt.a' \
            ! -name 'libnvjpeg_static.a' \
            ! -name 'libnvjpeg2k_static.a' \
            ! -name 'libculibos.a' \
            -delete 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates gpg wget

          # CMake 3.30+ from Kitware
          wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ noble main' | tee /etc/apt/sources.list.d/kitware.list >/dev/null
          apt-get update

          # CMake is pinned: 4.4.1 regressed check_symbol_exists, which stops
          # honouring CMAKE_REQUIRED_FLAGS and silently fails feature detection
          # (upstream: gitlab.kitware.com/cmake/cmake/-/work_items/28001).
          # Unpinned installs silently misconfigure ports rather than failing loudly.
          apt-get install -y git curl unzip \
            cmake=4.4.0-0kitware1ubuntu24.04.1 cmake-data=4.4.0-0kitware1ubuntu24.04.1 \
            gcc-14 g++-14 ccache ninja-build \
            zip tar pkg-config python3 python3-dev python3-venv libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev \
            libwayland-dev libxkbcommon-dev libegl-dev libdecor-0-dev libibus-1.0-dev libdbus-1-dev \
            libsystemd-dev libgtk-3-dev xvfb xauth \
            nasm autoconf autoconf-archive automake libtool ffmpeg

          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
                              --slave /usr/bin/g++ g++ /usr/bin/g++-14

      - name: Normalize vcpkg path
        run: echo "VCPKG_ROOT=$(realpath -m "$VCPKG_ROOT")" >> "$GITHUB_ENV"

      - name: Cache vcpkg tool
        id: cache-vcpkg-tool
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_ROOT }}
          # The vcpkg checkout must contain every pinned port version, so the key moves
          # with the pins. No restore-keys: an older clone restored under a new key
          # would make the clone below fail on the existing directory.
          key: vcpkg-tool-${{ runner.os }}-2026-10-22

      - name: Setup vcpkg
        run: |
          # A restore-key match also supplies a checkout, despite cache-hit=false.
          if [ ! -d "$VCPKG_ROOT/.git" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          fi
          if [ ! -x "$VCPKG_ROOT/vcpkg" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Configure vcpkg triplet
        run: |
          cat >> $VCPKG_ROOT/triplets/x64-linux.cmake << 'EOF'
          set(VCPKG_BUILD_TYPE release)
          set(VCPKG_MAX_CONCURRENCY 2)
          EOF

      # Release objects are built with -march=native; ccache keys the flag, not the CPU.
      - name: Identify CPU for the compiler cache
        id: cpu
        run: echo "model=$(grep -m1 'model name' /proc/cpuinfo | md5sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: /github/home/.cache/ccache
          key: ccache-${{ runner.os }}-${{ matrix.build_type }}-${{ steps.cpu.outputs.model }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-${{ matrix.build_type }}-${{ steps.cpu.outputs.model }}-

      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: /github/home/.cache/vcpkg/archives
          key: vcpkg-pkgs-${{ runner.os }}-linux-gui-prebuilt-ort-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/overlays/**') }}
          restore-keys: vcpkg-pkgs-${{ runner.os }}-linux-gui-prebuilt-ort-

      - name: Restore vcpkg downloads
        id: cache-vcpkg-downloads
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/overlays/**') }}
          restore-keys: vcpkg-downloads-${{ runner.os }}-

      - name: Configure
        run: |
          python3 tools/ci_retry_configure.py -- cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLFS_HIDDEN_SYMBOLS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }} \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            -DBUILD_FORMAT_TESTS=ON \
            -DBUILD_TEMPORAL_CPU_TESTS=${{ matrix.build_type == 'Release' && 'ON' || 'OFF' }} \
            -DBUILD_SELECTION_OUTLINE_TESTS=ON \
            -DBUILD_PYTHON_STUBS=OFF \
            -DLFS_DEV_IMPORT_SOURCE_PYTHON=OFF \
            -DLFS_DEV_IMPORT_SOURCE_RESOURCES=OFF \
            -DLFS_ENABLE_CUDA_DEVICE_DEBUG=OFF \
            -DCMAKE_C_FLAGS="-pipe -gz" \
            -DCMAKE_CXX_FLAGS="-pipe -gz" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--compress-debug-sections=zlib" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--compress-debug-sections=zlib"

      # Save fetched archives even when configure fails later. vcpkg verifies
      # downloaded archives against their hashes.
      - name: Save vcpkg downloads
        if: always() && !cancelled() && steps.cache-vcpkg-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/overlays/**') }}

      - name: Clean vcpkg buildtrees
        run: |
          rm -rf build/vcpkg_installed/vcpkg/blds build/vcpkg_installed/vcpkg/pkgs
          rm -rf "$VCPKG_ROOT"/buildtrees "$VCPKG_ROOT"/packages
          df -h

      - name: Build
        run: cmake --build build -j $(nproc)

      - name: Run driver entry compatibility contracts without a GPU
        run: ctest --test-dir build --output-on-failure --no-tests=error -R '^CudaDriverEntryContracts$'

      - name: Run CPU-only SDL coordinate tests
        # The default app build also builds this isolated, SDL-free test executable.
        run: ctest --test-dir build --output-on-failure --no-tests=error -R '^lichtfeld\.sdl_coordinates$'

      - name: Run shared tensor operation CPU contracts
        run: |
          cmake --build build --target tensor_operation_contracts --parallel 2
          mkdir -p "$RUNNER_TEMP/cuda-driver-stub"
          ln -sf /usr/local/cuda/lib64/stubs/libcuda.so "$RUNNER_TEMP/cuda-driver-stub/libcuda.so.1"
          LD_LIBRARY_PATH="$RUNNER_TEMP/cuda-driver-stub${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ctest --test-dir build --output-on-failure --no-tests=error -R '^TensorOperationContracts[.](CPU|Runner)$'

      - name: Run splat drag contracts
        run: |
          mkdir -p "$RUNNER_TEMP/cuda-driver-stub"
          ln -sf /usr/local/cuda/lib64/stubs/libcuda.so "$RUNNER_TEMP/cuda-driver-stub/libcuda.so.1"
          LD_LIBRARY_PATH="$RUNNER_TEMP/cuda-driver-stub${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ctest --test-dir build --output-on-failure --no-tests=error -R '^(selection_outline_contract|splat_drag_axes_contract|splat_transfer_contract|wayland_drag_contract|x11_drag_contract|file_transfer_progress_contract|native_modal_frame_contract)$'

      - name: Build and run CPU-only format tests
        run: |
          cmake --build build --target lichtfeld_format_tests -j $(nproc)
          ctest --test-dir build --output-on-failure --no-tests=error -R '^lichtfeld_format_tests$'

      - name: Run offline media regression tests
        if: matrix.build_type == 'Release'
        run: |
          cmake --build build --target media_contracts --parallel 2
          # Match the CPU Python tests: the runner has no NVIDIA driver.
          mkdir -p "$RUNNER_TEMP/cuda-driver-stub"
          ln -sf /usr/local/cuda/lib64/stubs/libcuda.so "$RUNNER_TEMP/cuda-driver-stub/libcuda.so.1"
          LD_LIBRARY_PATH="$RUNNER_TEMP/cuda-driver-stub${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ctest --test-dir build -L media -LE gpu --output-on-failure --no-tests=error

      - name: Run viewer backend policy contracts
        run: |
          cmake --build build --target viewer_backend_contracts -j $(nproc)
          ctest --test-dir build --output-on-failure --no-tests=error -R '^ViewerBackendSelectionContracts$'

      - name: Run scene reconstruction CPU tests
        if: matrix.build_type == 'Release'
        run: |
          cmake --build build --target lichtfeld_temporal_cpu_tests -j $(nproc)
          ctest --test-dir build --output-on-failure --no-tests=error -R '^lichtfeld\.temporal\.cpu$'

      - name: Run scene reconstruction benchmark tests
        if: matrix.build_type == 'Release'
        run: |
          uv run --python 3.12 --no-project --with numpy --with pillow --with pytest python -m pytest -q tests/python/test_scene_reconstruction_benchmark.py

      - name: Build and run EXR image codec tests
        run: |
          cmake --build build --target lichtfeld_image_codec_tests -j $(nproc)
          ctest --test-dir build --output-on-failure -R '^lichtfeld_image_codec_tests$'

      - name: Build and run frame-demand CPU tests
        run: |
          cmake --build build --target lichtfeld_frame_tests -j $(nproc)
          ctest --test-dir build --output-on-failure -R '^lichtfeld_frame_tests$'

      - name: Build and run TLS distrust tests
        run: |
          cmake --build build --target lichtfeld_tls_distrust_tests -j $(nproc)
          ctest --test-dir build --output-on-failure --no-tests=error -R '^lichtfeld_tls_distrust_tests$'

      - name: Install Python test dependencies
        run: |
          build/vcpkg_installed/x64-linux/tools/python3/python3.12 -m ensurepip --user
          build/vcpkg_installed/x64-linux/tools/python3/python3.12 -m pip install --user -r tests/python/requirements-test.txt

      - name: Run CPU Python tests
        env:
          CUDA_VISIBLE_DEVICES: ''
          NVIDIA_VISIBLE_DEVICES: void
          DISPLAY: ''
        # The runner has no NVIDIA driver; the toolkit's stub libcuda lets the extension load without a GPU.
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          # github.workspace is the host path; Python runs in the job container.
          export LFS_TEST_BUILD_DIR="$PWD/build"
          mkdir -p "$RUNNER_TEMP/cuda-driver-stub"
          ln -sf /usr/local/cuda/lib64/stubs/libcuda.so "$RUNNER_TEMP/cuda-driver-stub/libcuda.so.1"
          LD_LIBRARY_PATH="$RUNNER_TEMP/cuda-driver-stub${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            build/vcpkg_installed/x64-linux/tools/python3/python3.12 -X faulthandler -m pytest tests/python -m 'not gpu and not slow and not integration' -q

      # Reuse the Release job's dependencies; this is the real Core adapter,
      # not the isolated SDK-only module. No GPU execution is requested.
      - name: Cache HIP adapter SDK downloads
        if: matrix.build_type == 'Release' && needs.hip-native-changes.outputs.changed == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: hip-adapter-sdk-${{ runner.os }}-${{ hashFiles('cmake/hip-native/ci-requirements.txt') }}

      - name: Install pinned SDK for the HIP Tensor adapter
        if: matrix.build_type == 'Release' && needs.hip-native-changes.outputs.changed == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/hip-adapter-sdk"
          "$RUNNER_TEMP/hip-adapter-sdk/bin/python" -m pip install -r cmake/hip-native/ci-requirements.txt
          sdk_root="$("$RUNNER_TEMP/hip-adapter-sdk/bin/rocm-sdk" path --root)"
          echo "LFS_CI_HIP_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Compile HIP Tensor facade and run CPU contracts
        if: matrix.build_type == 'Release' && needs.hip-native-changes.outputs.changed == 'true'
        env:
          HIP_VISIBLE_DEVICES: '-1'
          ROCR_VISIBLE_DEVICES: '-1'
          CUDA_VISIBLE_DEVICES: ''
        run: |
          python3 tools/ci_retry_configure.py -- cmake -S . -B build-hip-adapter -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVCPKG_INSTALLED_DIR="$PWD/build/vcpkg_installed" \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DLFS_ENABLE_CUDA=OFF -DLFS_TENSOR_HIP=ON -DLFS_BUILD_TRAINER=OFF \
            -DLFS_HIP_ROOT="$LFS_CI_HIP_ROOT" -DLFS_HIP_ARCHITECTURE=gfx1150 \
            -DBUILD_PYTHON_STUBS=OFF \
            -DLFS_DEV_IMPORT_SOURCE_PYTHON=OFF -DLFS_DEV_IMPORT_SOURCE_RESOURCES=OFF
          cmake --build build-hip-adapter --target tensor_operation_contracts tensor_binding_contracts --parallel 2
          ctest --test-dir build-hip-adapter --output-on-failure --no-tests=error \
            -R '^(TensorOperationContracts[.](CPU|Runner)|TensorPythonBindings[.]CPU)$'

  idle-e2e:
    name: GPU idle E2E (optional)
    # Opt-in upstream check: skipping is expected without LFS_GPU_RUNNER=true.
    # Requires a self-hosted Linux GPU runner, a configured build tree and
    # LFS_RENDER_IDLE_MANIFEST. Fork pushes must not schedule this job.
    if: github.repository == 'MrNeRF/LichtFeld-Studio' && vars.LFS_GPU_RUNNER == 'true'
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 30
    env:
      DISPLAY: :92
      LFS_MCP_PORT: 45692
      LFS_RENDER_IDLE_MANIFEST: ${{ vars.LFS_RENDER_IDLE_MANIFEST }}
      LFS_EXECUTABLE: ${{ github.workspace }}/build/LichtFeld-Studio
      LFS_TEST_BUILD_DIR: ${{ github.workspace }}/build
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          clean: false
      - name: Build the GUI executable
        run: cmake --build build --target LichtFeld-Studio -j6
      - name: Run CUDA node and spatial tests
        run: |
          cmake --build build --target lichtfeld_tests lfs_py cuda_driver_entry_live_tests -j6
          ctest --test-dir build --output-on-failure --no-tests=error -R '^CudaDriverEntryLive$'
          build/tests/lichtfeld_tests --tensor-backend=cuda --gtest_filter='Nodes*:*Nodes*:McpNode*:*Spatial*'
          build/vcpkg_installed/x64-linux/tools/python3/python3.12 -m pytest \
            tests/python/test_nodes.py -q
      - name: Start Xvfb when needed
        run: |
          if ! xdpyinfo -display :92 >/dev/null 2>&1; then
            Xvfb :92 -screen 0 1920x1080x24 -nolisten tcp &
            echo $! > "$RUNNER_TEMP/render-on-demand-xvfb.pid"
            for _ in $(seq 1 50); do
              xdpyinfo -display :92 >/dev/null 2>&1 && break
              sleep 0.2
            done
          fi
      - name: Run generated capture regression
        run: ctest --test-dir build --output-on-failure --no-tests=error -R '^lichtfeld\.python\.capture_environment$'
      - name: Run generated dataset admission regression
        run: ctest --test-dir build --output-on-failure --no-tests=error -R '^lichtfeld\.python\.dataset_load_training$'
      - name: Run generated training strategy regression
        run: ctest --test-dir build --output-on-failure --no-tests=error -R '^lichtfeld\.python\.training_strategy_update$'
      - name: Run render-on-demand GPU idle test
        env:
          LFS_RENDER_IDLE_SHOTS: ${{ runner.temp }}/render-on-demand-shots
        run: |
          test -n "$LFS_RENDER_IDLE_MANIFEST"
          build/vcpkg_installed/x64-linux/tools/python3/python3.12 -m pytest \
            tests/python/test_render_on_demand_idle.py -m 'gpu and integration' -q
      - name: Stop Xvfb started by this job
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/render-on-demand-xvfb.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/render-on-demand-xvfb.pid")" || true
            rm -f "$RUNNER_TEMP/render-on-demand-xvfb.pid"
          fi

  # .clang-tidy is for local/IDE use only here; CI needs compile_commands.json in a later phase.
  error-debt-gate:
    if: github.repository == 'MrNeRF/LichtFeld-Studio' || github.event.pull_request.base.repo.full_name == 'MrNeRF/LichtFeld-Studio'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Test the gate scripts
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Generate error-debt census
        run: python3 tools/error_debt_census.py > error-debt-census.json

      - name: Enforce no-new-error-debt baseline
        run: python3 tools/error_debt_census.py --baseline tools/error_debt_baseline.json

      - name: Enforce I/O discipline
        run: python3 tools/check_io_discipline.py

      - name: Enforce backend neutrality
        run: python3 tools/check_backend_neutrality.py

      - name: Enforce LOG placeholders (printf in CUDA, std::format elsewhere)
        run: python3 tools/check_cuda_log_format.py

      - name: Upload error-debt census
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: error-debt-census
          path: error-debt-census.json
