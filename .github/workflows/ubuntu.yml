name: Ubuntu CUDA Build

on:
  push:
    branches: [ dev, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ dev, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-ubuntu:
    if: github.repository == 'MrNeRF/LichtFeld-Studio' || github.event.pull_request.base.repo.full_name == 'MrNeRF/LichtFeld-Studio'
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.8.0-devel-ubuntu24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      CC: gcc-14
      CXX: g++-14
      VCPKG_BUILD_TYPE: release
      VCPKG_FORCE_SYSTEM_BINARIES: 1
      CMAKE_MAKE_PROGRAM: /usr/bin/ninja
      CUDA_PATH: /usr/local/cuda
      CUDNN_ROOT_DIR: /usr/local/cuda

    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        run: |
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          # Host paths (may not exist in container)
          rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/lib/android /opt/az
          # CUDA extras - samples, docs, tools we don't need
          rm -rf /usr/local/cuda/nsight* /usr/local/cuda/compute-sanitizer
          rm -rf /usr/local/cuda/extras /usr/local/cuda/tools
          rm -rf /usr/local/cuda/doc
          # Remove large static libs but keep ones needed for build
          find /usr/local/cuda/targets/x86_64-linux/lib -name '*.a' \
            ! -name 'libcudart_static.a' \
            ! -name 'libcudadevrt.a' \
            ! -name 'libnvjpeg_static.a' \
            ! -name 'libnvjpeg2k_static.a' \
            ! -name 'libculibos.a' \
            -delete 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates gpg wget

          # CMake 3.30+ from Kitware
          wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ noble main' | tee /etc/apt/sources.list.d/kitware.list >/dev/null
          apt-get update

          # CMake is pinned: 4.4.1 regressed check_symbol_exists, which stops
          # honouring CMAKE_REQUIRED_FLAGS and silently fails feature detection
          # (upstream: gitlab.kitware.com/cmake/cmake/-/work_items/28001).
          # Unpinned installs silently misconfigure ports rather than failing loudly.
          apt-get install -y git curl unzip jq \
            cmake=4.4.0-0kitware1ubuntu24.04.1 cmake-data=4.4.0-0kitware1ubuntu24.04.1 \
            gcc-14 g++-14 ccache ninja-build \
            zip tar pkg-config python3 python3-dev libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev \
            libwayland-dev libxkbcommon-dev libegl-dev libdecor-0-dev libibus-1.0-dev libdbus-1-dev \
            libsystemd-dev libgtk-3-dev \
            nasm autoconf autoconf-archive automake libtool

          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
                              --slave /usr/bin/g++ g++ /usr/bin/g++-14

      - name: Ensure cuDNN is available
        shell: bash
        run: |
          set -euo pipefail
          # /usr/local/cuda and its lib64 are symlinks, so find must follow them (-L).
          if [ -f /usr/local/cuda/include/cudnn.h ] && \
             find -L /usr/local/cuda /usr/lib /usr/lib/x86_64-linux-gnu -name 'libcudnn.so.9*' -print -quit | grep -q .; then
            echo "Using preinstalled cuDNN:"
            find -L /usr/local/cuda /usr/lib /usr/lib/x86_64-linux-gnu -name 'libcudnn.so.9*' -print | head
            exit 0
          fi

          echo "cuDNN 9 was not provided by the runner image; installing cuDNN 9.5.0 for CUDA 12 from NVIDIA redist."
          CUDNN_URL="https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-9.5.0.50_cuda12-archive.tar.xz"
          mkdir -p /tmp/cudnn-redist
          curl -L --retry 5 --retry-delay 10 "$CUDNN_URL" -o /tmp/cudnn.tar.xz
          # We link cuDNN dynamically, so extract only headers and shared libs; the
          # static archives are multi-GB and unused. Drop the tarball and staging tree
          # as soon as they are consumed to keep peak disk usage down.
          tar -xf /tmp/cudnn.tar.xz --strip-components=1 -C /tmp/cudnn-redist --exclude='*.a'
          rm -f /tmp/cudnn.tar.xz
          cp -a /tmp/cudnn-redist/include/. /usr/local/cuda/include/
          cp -a /tmp/cudnn-redist/lib/. /usr/local/cuda/lib64/
          rm -rf /tmp/cudnn-redist
          ldconfig
          test -f /usr/local/cuda/include/cudnn.h
          if ! find -L /usr/local/cuda/lib64 -name 'libcudnn.so.9*' -print -quit | grep -q .; then
            echo "cuDNN 9 library was not found after setup." >&2
            exit 1
          fi
          find -L /usr/local/cuda/lib64 -name 'libcudnn.so.9*' -print | head
          df -h

      - name: Cache vcpkg tool
        id: cache-vcpkg-tool
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-tool-${{ runner.os }}-2026-02-21
          restore-keys: vcpkg-tool-${{ runner.os }}-

      - name: Setup vcpkg
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure vcpkg triplet
        run: |
          cat >> $VCPKG_ROOT/triplets/x64-linux.cmake << 'EOF'
          set(VCPKG_BUILD_TYPE release)
          set(VCPKG_MAX_CONCURRENCY 2)
          EOF

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /github/home/.cache/ccache
          key: ccache-${{ runner.os }}-${{ matrix.build_type }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-${{ matrix.build_type }}-

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: /github/home/.cache/vcpkg/archives
          key: vcpkg-pkgs-${{ runner.os }}-linux-gui-prebuilt-ort-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/overlays/**') }}
          restore-keys: vcpkg-pkgs-${{ runner.os }}-linux-gui-prebuilt-ort-

      # LibTorch is only needed to configure the test build; the application
      # itself is LibTorch-free. Restricted to the Release matrix entry.
      #
      # Deliberately not cached: the archive is ~6GB against a 10GB per-repo
      # cache budget that is already full, so storing it evicts the vcpkg and
      # ccache entries that actually make builds fast. Downloading from the
      # PyTorch CDN each run is the cheaper trade.
      - name: Download LibTorch
        if: matrix.build_type == 'Release'
        run: |
          curl -fL --retry 3 -o libtorch.zip \
            "https://download.pytorch.org/libtorch/cu128/libtorch-cxx11-abi-shared-with-deps-2.7.1%2Bcu128.zip"
          unzip -q libtorch.zip -d external/
          rm -f libtorch.zip
          df -h /

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            -DBUILD_PYTHON_STUBS=OFF \
            -DLFS_DEV_IMPORT_SOURCE_PYTHON=OFF \
            -DLFS_DEV_IMPORT_SOURCE_RESOURCES=OFF \
            -DLFS_ENABLE_CUDA_DEVICE_DEBUG=OFF \
            -DCMAKE_C_FLAGS="-pipe -gz" \
            -DCMAKE_CXX_FLAGS="-pipe -gz" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--compress-debug-sections=zlib" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--compress-debug-sections=zlib"

      - name: Clean vcpkg buildtrees
        run: |
          rm -rf build/vcpkg_installed/vcpkg/blds build/vcpkg_installed/vcpkg/pkgs
          rm -rf "$VCPKG_ROOT"/buildtrees "$VCPKG_ROOT"/downloads "$VCPKG_ROOT"/packages
          df -h

      - name: Build application
        run: cmake --build build -j $(nproc)

      # Tests are configured into their own build tree. Turning BUILD_TESTS on in
      # the application's tree makes find_package(Torch) run during the app
      # configure and changes how the application itself is built; the source
      # build guide keeps them separate for that reason. VCPKG_INSTALLED_DIR is
      # reused so this does not restore the whole dependency set a second time.
      # The application is linked by now, so its object files are dead weight.
      # A second build tree plus LibTorch does not fit beside them on a runner
      # with ~14GB free.
      - name: Reclaim disk before test build
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          df -h /
          find build -name '*.o' -delete 2>/dev/null || true
          rm -rf "$VCPKG_ROOT"/buildtrees "$VCPKG_ROOT"/downloads "$VCPKG_ROOT"/packages 2>/dev/null || true
          echo "after reclaim:"
          df -h /

      - name: Configure tests
        if: matrix.build_type == 'Release'
        run: |
          cmake -S . -B build-tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            -DVCPKG_INSTALLED_DIR="${GITHUB_WORKSPACE}/build/vcpkg_installed" \
            -DBUILD_PYTHON_STUBS=OFF

      # shell: bash is required. The default run shell in this container does not
      # support `set -o pipefail` or ${PIPESTATUS[@]}, and exits 2 before running
      # a single line of the script — see the cuDNN step, which declares it for
      # the same reason.
      - name: Build tests
        if: matrix.build_type == 'Release'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          set +e
          # Fewer jobs than cores: LibTorch-including units are memory hungry.
          cmake --build build-tests --target lichtfeld_tests -j 2 2>&1 | tee /tmp/build-tests.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Test build failed with exit $rc"
            "${GITHUB_WORKSPACE}/.github/report-build-failure.sh" "Test build" /tmp/build-tests.log || true
            exit 1
          fi

      # Python test dependencies are not part of the vcpkg python; without them
      # lichtfeld.python.fast fails on a missing module rather than on an
      # assertion.
      - name: Install Python test dependencies
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          # Match the interpreter only. python3.12-config lives in the same
          # directory and satisfies a naive python3.* glob.
          PY="${GITHUB_WORKSPACE}/build/vcpkg_installed/x64-linux/tools/python3/python3"
          [ -x "$PY" ] || PY=$(find "${GITHUB_WORKSPACE}/build/vcpkg_installed" -maxdepth 4 -type f \
              -regex '.*/python3\.[0-9]+' -perm -u+x 2>/dev/null | sort | head -1)
          [ -n "$PY" ] && [ -x "$PY" ] || PY=$(command -v python3)
          echo "using interpreter: $PY"
          "$PY" -m ensurepip --upgrade >/dev/null 2>&1 || true
          "$PY" -m pip install -q -r tests/python/requirements-test.txt

      # GitHub runners have no NVIDIA driver, so libcuda.so.1 is absent and the
      # test binary — which links the CUDA driver API — cannot even load. The
      # toolkit ships a stub for exactly this case, but names it libcuda.so with
      # no soname symlink, so create one.
      #
      # lichtfeld.cpu is the only ctest label not marked "gpu"; every other suite
      # needs a real device.
      - name: Run CPU tests
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          set -euo pipefail
          STUBS=""
          for candidate in /usr/local/cuda/lib64/stubs /usr/local/cuda/targets/x86_64-linux/lib/stubs; do
            if [ -f "$candidate/libcuda.so" ]; then STUBS="$candidate"; break; fi
          done
          if [ -n "$STUBS" ]; then
            [ -e "$STUBS/libcuda.so.1" ] || ln -s libcuda.so "$STUBS/libcuda.so.1"
            export LD_LIBRARY_PATH="$STUBS${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            echo "using CUDA driver stubs from $STUBS"
          else
            echo "::warning::no CUDA driver stubs found; the test binary may fail to load"
          fi
          if ldd build-tests/tests/lichtfeld_tests 2>/dev/null | grep 'not found'; then
            echo "::error::test binary has unresolved shared libraries (see above)"
            exit 1
          fi
          ctest --test-dir build-tests -L cpu --output-on-failure
