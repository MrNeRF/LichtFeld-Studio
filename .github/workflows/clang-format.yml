name: Clang Format Check

on:
  push:
    branches: [ dev, master ]
  workflow_dispatch:

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Print clang-format version
        run: clang-format --version

      - name: Check formatting
        run: |
          if ! find . -regex '.*\.\(cpp\|hpp\|cc\|c\|h\|cu\|cuh\)' -exec clang-format --dry-run -Werror {} + 2>&1; then
            echo "Formatting issues detected. Run clang-format -i to fix."
            exit 1
          fi
          echo "All files are formatted correctly."
