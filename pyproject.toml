[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lichtfeld-training-protocol"
version = "0.1.0"
description = "Local training-session snapshots shared by LichtFeld Studio and its Blender extension"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "LichtFeld Studio Authors"}]

[tool.setuptools]
package-dir = {"" = "src/python"}
packages = ["lichtfeld_sessions"]
py-modules = ["_lfs_path_io"]
